name: Offline validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm run workbench:verify
      - run: npm test
      - run: npm run workbench:test
      - run: npm ci --prefix community-site
      - run: npm run build --prefix community-site
      - run: npm test --prefix community-site
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history and nested source archives
        run: |
          "$RUNNER_TEMP/gitleaks" git --log-opts='--all' --redact --ignore-gitleaks-allow --no-banner .
          mkdir "$RUNNER_TEMP/source-scan"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source-scan"
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --ignore-gitleaks-allow --max-archive-depth=12 --no-banner "$RUNNER_TEMP/source-scan"
